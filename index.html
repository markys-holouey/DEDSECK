<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEDSECK</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1020; color: #e8eaf6; min-height: 100vh; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: translateX(-50%) scale(.8) translateY(20px); } 60% { transform: translateX(-50%) scale(1.05); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.5); } 50% { box-shadow: 0 0 0 6px rgba(231,76,60,0); } }
  @keyframes expand { from { opacity: 0; transform: translateY(-8px); max-height: 0; } to { opacity: 1; transform: none; max-height: 2000px; } }
  .anim-in { animation: fadeUp .45s ease both; }
  .anim-in:nth-child(2) { animation-delay: .07s; }
  .anim-in:nth-child(3) { animation-delay: .14s; }
  .anim-in:nth-child(4) { animation-delay: .21s; }
  .anim-in:nth-child(5) { animation-delay: .28s; }

  .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #8a93b2; margin-bottom: 24px; }
  .card { background: #171b2e; border-radius: 14px; padding: 24px; width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.4); animation: fadeUp .5s ease both; }
  label { display: block; margin: 10px 0 4px; color: #8a93b2; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3050; background: #0d1020; color: #e8eaf6; font-size: 15px; transition: border-color .2s, box-shadow .2s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #5b5bd6; box-shadow: 0 0 0 3px rgba(91,91,214,.25); }

  button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px; font-size: 15px; background: #5b5bd6; color: #fff; margin-top: 10px; transition: transform .12s ease, box-shadow .2s, filter .2s; }
  button:hover { filter: brightness(1.15); box-shadow: 0 4px 14px rgba(91,91,214,.35); }
  button:active { transform: scale(.95); }
  button.gray { background: #2a3050; }
  button.gray:hover { box-shadow: 0 4px 14px rgba(42,48,80,.6); }
  button.danger { background: #c0392b; }
  button.danger:hover { box-shadow: 0 4px 14px rgba(192,57,43,.45); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  .err { color: #ff6b6b; margin-top: 10px; font-size: 14px; }
  .err.shake { animation: shake .3s ease; }
  .ok { color: #5dd39e; margin-top: 10px; font-size: 14px; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #171b2e; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .topbar b { margin-right: auto; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  .panel { background: #171b2e; border-radius: 12px; padding: 18px; margin-bottom: 16px; transition: transform .2s, box-shadow .2s; }
  .panel:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .panel h3 { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input, .row > select { flex: 1; min-width: 120px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: #0d1020; border-radius: 8px; margin-top: 8px; transition: background .2s, transform .15s; animation: fadeUp .3s ease both; }
  .item:hover { background: #141830; transform: translateX(2px); }
  .item.clickable { cursor: pointer; user-select: none; }
  .item.clickable:hover { border-left: 3px solid #5b5bd6; padding-left: 9px; }
  .item.selected { border-left: 3px solid #7c7cf0; padding-left: 9px; }
  .detail { background: #10142a; border-radius: 10px; padding: 14px; margin-top: 6px; margin-bottom: 4px; animation: expand .3s ease both; }
  .small { color: #8a93b2; font-size: 13px; }
  .points { font-size: 22px; font-weight: bold; color: #ffd166; }
  .divider { border: none; border-top: 1px dashed #2a3050; margin: 18px 0; }
  .badge { background: #e74c3c; border-radius: 10px; padding: 1px 7px; font-size: 12px; animation: pulse 2s infinite; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .dot.off { background: #555f80; }

  #toast { position: fixed; left: 50%; bottom: 24px; background: #5b5bd6; padding: 12px 20px; border-radius: 10px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 99; max-width: 90vw; animation: pop .35s ease both; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="authScreen" class="center">
  <div>
    <h1>DEDSECK</h1>
    <div class="sub">Вход по нику и паролю</div>
    <div class="card">
      <label>Ник</label>
      <input id="nick" placeholder="polostyanoy">
      <label>Пароль</label>
      <input id="pass" type="password">
      <button id="btnLogin" style="width:100%">Войти</button>
      <div id="authMsg" class="err"></div>
      <div class="small" style="text-align:center;margin-top:12px">Аккаунты выдаёт владелец сайта</div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <b>DEDSECK</b>
    <span id="whoami" class="small"></span>
    <button id="btnNotif" class="gray">🔔 Вкл. уведомления</button>
    <button id="btnLogout" class="gray">Выйти</button>
  </div>

  <div class="wrap">

    <div class="panel anim-in">
      <h3>👤 Кабинет</h3>
      <div class="small">Мои баллы</div>
      <div class="points" id="pointsBig">0</div>
      <hr class="divider">
      <div class="small" style="margin-bottom:6px">Мои записи</div>
      <div class="row">
        <input id="recText" placeholder="Текст записи">
        <button id="btnAddRec">Добавить</button>
      </div>
      <div id="recList"></div>
    </div>

    <div class="panel anim-in">
      <h3>🔔 Уведомления <span id="notifBadge"></span></h3>
      <div id="notifList"></div>
      <button id="btnReadMark" class="gray" style="font-size:13px;margin-top:8px">Отметить прочитанным</button>
    </div>

    <div id="adminSection" class="hidden">

      <!-- Кнопка, открывающая блок участников -->
      <div class="panel anim-in">
        <button id="btnMembers" style="width:100%;font-size:16px;padding:14px">👥 Участники</button>
      </div>

      <!-- Отдельный блок участников: открывается и закрывается кнопкой -->
      <div id="membersBlock" class="panel hidden">
        <h3>👥 Участники</h3>

        <div class="small" style="margin-bottom:6px">Создать аккаунт</div>
        <div class="row">
          <input id="newNick" placeholder="Ник нового участника">
          <input id="newPass" placeholder="Пароль (мин. 6 символов)">
          <button id="btnCreate">Создать</button>
        </div>
        <div id="createMsg" class="ok"></div>

        <hr class="divider">
        <button id="btnReload" class="gray" style="margin-top:0">🔄 Обновить список</button>
        <div class="small" style="margin-top:8px">Нажми на участника, чтобы начислить/списать баллы или удалить его</div>
        <div id="accList"></div>
      </div>

      <div class="panel anim-in">
        <h3>📣 Разослать</h3>
        <label>Кому</label>
        <select id="sendTo"><option value="all">Всем</option></select>
        <label>Текст</label>
        <textarea id="sendText" rows="2" placeholder="Сообщение для участников"></textarea>
        <button id="btnSend">Отправить</button>
        <div id="sendMsg" class="ok"></div>
      </div>

    </div>

  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {

/* ═══════════════════════════════════════════════════════
   ⚠️ Адрес ниже должен быть скопирован кнопкой Copy
   из панели Supabase (страница проекта, рядом с адресом).
   ═══════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://hpcjtximqeuqtlidkacv.supabase.co";
const SUPABASE_KEY = "sb_publishable_PHPrQs4SWGAbALyGONePyA_paI6vt4A";

const ADMIN_EMAIL = 'polostyanoy@mysait.local';
const ONLINE_MS = 35000; /* в сети, если активен последние 35 секунд */
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, myNick = '', isAdmin = false, savedCreds = null;
let pollTimer = null, pollLast = new Date().toISOString();
let notifCache = [], seen = new Set(), accounts = [];
let unreadCount = 0;
let selectedId = null;
let membersOpen = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('btnLogin').onclick = login;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const nick = $('nick').value.trim().toLowerCase();
  const pass = $('pass').value;
  const m = $('authMsg');
  m.textContent = ''; m.classList.remove('shake');
  if (!nick || !pass) { m.textContent = 'Заполни ник и пароль'; void m.offsetWidth; m.classList.add('shake'); return; }
  const email = nick + '@mysait.local';
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    m.textContent = /invalid/i.test(error.message) ? 'Неверный ник или пароль' : (error.message || 'Не удалось войти');
    void m.offsetWidth; m.classList.add('shake');
    return;
  }
  savedCreds = { email, pass };
  sessionStorage.setItem('admin_creds', JSON.stringify(savedCreds));
  enterApp(nick);
}

async function enterApp(nick) {
  const { data: u } = await supabase.auth.getUser();
  me = u.user;
  myNick = nick;
  isAdmin = (me.email === ADMIN_EMAIL);

  const { data: rows, error: selErr } = await supabase.from('accounts').select('*').eq('user_id', me.id);
  if (selErr) toast('Ошибка чтения таблицы accounts: ' + selErr.message);
  if (!rows || !rows.length) {
    const { error: insErr } = await supabase.from('accounts')
      .insert({ user_id: me.id, nick, points: 0, last_seen: new Date().toISOString() });
    if (insErr) toast('Не удалось создать строку в accounts: ' + insErr.message);
  }
  updateLastSeen();

  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoami').textContent = myNick + (isAdmin ? ' (владелец)' : '');
  if (isAdmin) {
    $('adminSection').classList.remove('hidden');
    loadAccounts(); /* грузим заранее, чтобы список был готов к открытию */
  }

  await initNotifications();
  await loadRecords();
  await refreshPoints();
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 10000);
  window.scrollTo(0, 0);
}

/* Кнопка открытия/закрытия блока участников */
$('btnMembers').onclick = () => {
  membersOpen = !membersOpen;
  $('membersBlock').classList.toggle('hidden', !membersOpen);
  $('btnMembers').textContent = membersOpen ? '👥 Участники ▲' : '👥 Участники';
  if (membersOpen) loadAccounts();
};

async function updateLastSeen() {
  if (!me) return;
  await supabase.from('accounts').update({ last_seen: new Date().toISOString() }).eq('user_id', me.id);
}

async function refreshPoints() {
  const { data } = await supabase.from('accounts').select('points').eq('user_id', me.id).maybeSingle();
  $('pointsBig').textContent = data ? (data.points || 0) : 0;
}

async function loadRecords() {
  const { data, error } = await supabase.from('records').select('*').eq('user_id', me.id).order('created_at', { ascending: false });
  if (error) { toast('Ошибка записей: ' + error.message); return; }
  const list = $('recList'); list.innerHTML = '';
  for (const r of (data || [])) {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span>${esc(r.text)}</span>`;
    const b = document.createElement('button');
    b.className = 'danger'; b.style.cssText = 'margin-top:0;padding:4px 10px'; b.textContent = '✕';
    b.onclick = async () => { await supabase.from('records').delete().eq('id', r.id); loadRecords(); };
    d.appendChild(b);
    list.appendChild(d);
  }
  if (!(data || []).length) list.innerHTML = '<div class="small">Пока пусто</div>';
}
$('btnAddRec').onclick = async () => {
  const t = $('recText').value.trim();
  if (!t) return;
  const { error } = await supabase.from('records').insert({ user_id: me.id, text: t });
  if (error) { toast('Не удалось добавить: ' + error.message); return; }
  $('recText').value = '';
  loadRecords();
};

function isOnline(a) {
  if (!a.last_seen) return false;
  return (Date.now() - new Date(a.last_seen).getTime()) < ONLINE_MS;
}

async function loadAccounts() {
  if (!isAdmin) return;
  const { data, error } = await supabase.from('accounts').select('*').order('nick');
  const list = $('accList');
  if (error) {
    accounts = [];
    list.innerHTML = '<div class="err">Ошибка: ' + esc(error.message) +
      (error.message.toLowerCase().includes('row-level')
        ? '<br><br>Нужно выполнить SQL-скрипт (отключение защиты строк).'
        : '') +
      (error.message.toLowerCase().includes('does not exist')
        ? '<br><br>Таблица accounts не создана — выполни SQL-скрипт.'
        : '') +
      '</div>';
    return;
  }
  accounts = data || [];
  if (selectedId && !accounts.some(a => a.id === selectedId)) selectedId = null;
  renderAccountList();
  fillSendSelect();
}
$('btnReload').onclick = loadAccounts;

function renderAccountList() {
  const list = $('accList');
  if (!list) return;
  list.innerHTML = '';
  for (const a of accounts) {
    const isMe = a.user_id === me.id;
    const online = isOnline(a);

    const d = document.createElement('div');
    d.className = 'item clickable' + (a.id === selectedId ? ' selected' : '');
    d.innerHTML = `
      <span>
        <span class="dot ${online ? 'on' : 'off'}"></span><b>${esc(a.nick)}</b>${isMe ? ' <span class="small">(вы)</span>' : ''}
        &nbsp;<span class="small">⭐ ${a.points || 0}</span>
        <br><span class="small" style="margin-left:15px">${online ? 'в сети' : 'не в сети'}</span>
      </span>
      <span class="small">${a.id === selectedId ? '▲ свернуть' : '▼ открыть'}</span>`;

    d.onclick = () => {
      selectedId = (selectedId === a.id) ? null : a.id;
      renderAccountList();
    };

    list.appendChild(d);

    if (a.id === selectedId) {
      const det = document.createElement('div');
      det.className = 'detail';
      det.innerHTML = `
        <div class="row" style="margin-bottom:4px"><span><b>Ник:</b> ${esc(a.nick)}</span></div>
        <div class="row" style="margin-bottom:4px"><span><b>Статус:</b> <span class="dot ${online ? 'on' : 'off'}" style="margin:0 4px 0 0"></span>${online ? 'в сети' : 'не в сети'}</span></div>
        <div class="row" style="margin-bottom:4px"><span><b>Баллы:</b> <span class="points" style="font-size:18px">${a.points || 0}</span></span></div>
        <div class="small" style="margin:6px 0 2px">Пароль скрыт — Supabase хранит его зашифрованным.
        Ты сам придумывал его при создании. Сменить можно в Supabase: Authentication → Users → пользователь → Reset password.</div>
        <div class="small" style="margin:10px 0 2px"><b>Изменить баллы:</b></div>
        <div class="row">
          <input type="number" min="0" value="10" id="detAmount" style="max-width:110px">
        </div>
        <div class="row">
          <button id="detAdd">＋ Начислить</button>
          <button id="detSub" class="danger">－ Списать</button>
          <button id="detSet" class="gray">＝ Установить</button>
          <button id="detDel" class="danger" ${isMe ? 'disabled title="Нельзя удалить себя"' : ''}>🗑 Удалить участника</button>
        </div>
        <div id="detMsg" class="ok"></div>`;
      list.appendChild(det);

      det.querySelector('#detAdd').onclick = () => changePointsDet(a, 'add');
      det.querySelector('#detSub').onclick = () => changePointsDet(a, 'sub');
      det.querySelector('#detSet').onclick = () => changePointsDet(a, 'set');
      if (!isMe) det.querySelector('#detDel').onclick = () => deleteMember(a);
    }
  }
  if (!accounts.length) list.innerHTML = '<div class="small">Пока никого</div>';
}

async function changePointsDet(a, mode) {
  const det = $('accList').querySelector('.detail');
  if (!det) return;
  const amt = parseInt(det.querySelector('#detAmount').value, 10);
  const msg = det.querySelector('#detMsg');
  msg.className = 'ok'; msg.textContent = '';
  if (isNaN(amt) || amt < 0) { msg.className = 'err'; msg.textContent = 'Укажи число 0 или больше'; return; }
  let newVal;
  if (mode === 'set') newVal = amt;
  else if (mode === 'add') newVal = (a.points || 0) + amt;
  else newVal = Math.max(0, (a.points || 0) - amt);
  const { error } = await supabase.from('accounts').update({ points: newVal }).eq('id', a.id);
  if (error) { msg.className = 'err'; msg.textContent = 'Не получилось: ' + error.message; return; }
  let word;
  if (mode === 'set') word = `Ваш баланс изменён на ${newVal} балл(ов).`;
  else if (mode === 'add') word = `Вам начислено ${amt} балл(ов). Теперь у вас ${newVal}.`;
  else word = `У вас списано ${amt} балл(ов). Теперь у вас ${newVal}.`;
  await supabase.from('notifications').insert({ recipient_id: a.user_id, text: word });
  toast('Готово: у ' + a.nick + ' теперь ' + newVal + ' баллов');
  a.points = newVal;
  renderAccountList();
  await refreshPoints();
}

async function deleteMember(a) {
  if (!confirm('Удалить участника «' + a.nick + '»? Его баллы и запись о нём исчезнут.')) return;
  const { error } = await supabase.from('accounts').delete().eq('id', a.id);
  if (error) { toast('Не удалось удалить: ' + error.message); return; }
  if (selectedId === a.id) selectedId = null;
  toast('Участник ' + a.nick + ' удалён');
  await loadAccounts();
}

function fillSendSelect() {
  const st = $('sendTo'), cur = st.value;
  st.innerHTML = '<option value="all">Всем</option>' +
    accounts.filter(a => a.user_id && a.user_id !== me.id)
            .map(a => `<option value="${a.user_id}">${esc(a.nick)}</option>`).join('');
  if (cur) st.value = cur;
}

$('btnCreate').onclick = async () => {
  const nick = $('newNick').value.trim().toLowerCase();
  const pass = $('newPass').value;
  const msg = $('createMsg'); msg.className = 'ok'; msg.textContent = '';
  if (!nick || !pass) { msg.className = 'err'; msg.textContent = 'Заполни ник и пароль'; return; }
  if (pass.length < 6) { msg.className = 'err'; msg.textContent = 'Пароль минимум 6 символов'; return; }
  if (accounts.some(a => a.nick === nick)) { msg.className = 'err'; msg.textContent = 'Такой ник уже есть'; return; }
  if (!savedCreds) { try { savedCreds = JSON.parse(sessionStorage.getItem('admin_creds')); } catch (e) {} }
  const { data, error } = await supabase.auth.signUp({ email: nick + '@mysait.local', password: pass });
  if (error) { msg.className = 'err'; msg.textContent = error.message; return; }
  const { error: insErr } = await supabase.from('accounts')
    .insert({ user_id: data.user.id, nick, points: 0, last_seen: null });
  if (insErr) { msg.className = 'err'; msg.textContent = 'Пользователь создан, но строка в таблице нет: ' + insErr.message; return; }
  if (savedCreds) {
    await supabase.auth.signOut();
    await supabase.auth.signInWithPassword(savedCreds);
  }
  msg.textContent = 'Аккаунт ' + nick + ' создан';
  $('newNick').value = ''; $('newPass').value = '';
  await loadAccounts();
};

$('btnSend').onclick = async () => {
  const to = $('sendTo').value;
  const text = $('sendText').value.trim();
  const msg = $('sendMsg'); msg.className = 'ok'; msg.textContent = '';
  if (!text) { msg.className = 'err'; msg.textContent = 'Введи текст'; return; }
  const { error } = await supabase.from('notifications').insert({
    recipient_id: to === 'all' ? null : to,
    text
  });
  if (error) { msg.className = 'err'; msg.textContent = 'Ошибка: ' + error.message; return; }
  msg.textContent = 'Отправлено!';
  $('sendText').value = '';
};

function seenKey() { return 'seen_' + (me ? me.email : ''); }
function loadSeen() { try { seen = new Set(JSON.parse(localStorage.getItem(seenKey()) || '[]')); } catch (e) { seen = new Set(); } }
function saveSeen() { localStorage.setItem(seenKey(), JSON.stringify([...seen])); }

async function initNotifications() {
  loadSeen();
  const { data, error } = await supabase.from('notifications').select('*').order('created_at', { ascending: false }).limit(100);
  if (error) { toast('Ошибка уведомлений: ' + error.message); return; }
  notifCache = (data || []).filter(n => !n.recipient_id || n.recipient_id === me.id);
  notifCache.forEach(n => seen.add(n.id));
  saveSeen();
  unreadCount = 0;
  renderNotifs();
  pollLast = new Date().toISOString();
}

async function poll() {
  if (!me) return;
  updateLastSeen();
  if (isAdmin && membersOpen) {
    const { data: freshAccounts } = await supabase.from('accounts').select('*');
    if (freshAccounts) {
      accounts = freshAccounts;
      if (selectedId && !accounts.some(a => a.id === selectedId)) selectedId = null;
      renderAccountList();
      fillSendSelect();
    }
  }
  const { data } = await supabase.from('notifications').select('*').gt('created_at', pollLast).order('created_at');
  pollLast = new Date().toISOString();
  const fresh = (data || []).filter(n => (!n.recipient_id || n.recipient_id === me.id) && !notifCache.some(x => x.id === n.id));
  if (fresh.length) {
    notifCache = [...fresh, ...notifCache].slice(0, 100);
    unreadCount += fresh.length;
    renderNotifs();
    fresh.forEach(n => toast('🔔 ' + n.text));
    beep();
  }
}

function renderNotifs() {
  const l = $('notifList');
  l.innerHTML = notifCache.length ? '' : '<div class="small">Пока пусто</div>';
  notifCache.forEach((n, i) => {
    const d = document.createElement('div'); d.className = 'item';
    d.style.animationDelay = Math.min(i * 0.04, 0.4) + 's';
    d.innerHTML = `<span>${esc(n.text)}</span><span class="small" style="white-space:nowrap">${new Date(n.created_at).toLocaleString('ru', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</span>`;
    l.appendChild(d);
  });
  updateBadge();
}

function updateBadge() {
  $('notifBadge').innerHTML = unreadCount ? ` <span class="badge">${unreadCount}</span>` : '';
}

$('btnReadMark').onclick = () => {
  notifCache.forEach(n => seen.add(n.id));
  saveSeen();
  unreadCount = 0;
  updateBadge();
  toast('Все уведомления отмечены прочитанными');
};

let toastTimer = null;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.style.display = 'block';
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 5000);
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.18);
    setTimeout(() => ctx.close(), 500);
  } catch (e) {}
}
$('btnNotif').onclick = async () => {
  if (!('Notification' in window)) { toast('Браузер не поддерживает уведомления'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    $('btnNotif').textContent = '🔔 Уведомления вкл.';
    new Notification('Мой сайт', { body: 'Уведомления включены!' });
  }
};

$('btnLogout').onclick = async () => {
  clearInterval(pollTimer);
  await supabase.auth.signOut();
  location.reload();
};

/* Без автовхода: при каждом открытии страницы выходим из аккаунта */
(async () => {
  await supabase.auth.signOut();
  sessionStorage.removeItem('admin_creds');
})();

})();
