<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1020; color: #e8eaf6; min-height: 100vh; }
  .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #8a93b2; margin-bottom: 24px; }
  .card { background: #171b2e; border-radius: 14px; padding: 24px; width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  label { display: block; margin: 10px 0 4px; color: #8a93b2; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3050; background: #0d1020; color: #e8eaf6; font-size: 15px; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px; font-size: 15px; background: #5b5bd6; color: #fff; margin-top: 10px; }
  button:hover { filter: brightness(1.15); }
  button.gray { background: #2a3050; }
  button.danger { background: #c0392b; }
  .err { color: #ff6b6b; margin-top: 10px; font-size: 14px; }
  .ok { color: #5dd39e; margin-top: 10px; font-size: 14px; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #171b2e; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  .topbar b { margin-right: auto; }
  .badge { background: #e74c3c; border-radius: 10px; padding: 1px 7px; font-size: 12px; margin-left: 4px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  /* ЛЕНТА: панели идут друг за другом, как посты */
  .panel { background: #171b2e; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .panel h3 { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input, .row > select { flex: 1; min-width: 120px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: #0d1020; border-radius: 8px; margin-top: 8px; }
  .small { color: #8a93b2; font-size: 13px; }
  .points { font-size: 22px; font-weight: bold; color: #ffd166; }
  .divider { border: none; border-top: 1px dashed #2a3050; margin: 18px 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #5b5bd6; padding: 12px 20px; border-radius: 10px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 99; max-width: 90vw; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="authScreen" class="center">
  <div>
    <h1>Мой сайт</h1>
    <div class="sub">Вход по нику и паролю</div>
    <div class="card">
      <label>Ник</label>
      <input id="nick" placeholder="polostyanoy">
      <label>Пароль</label>
      <input id="pass" type="password">
      <button id="btnLogin" style="width:100%">Войти</button>
      <div id="authMsg" class="err"></div>
      <div class="small" style="text-align:center;margin-top:12px">Аккаунты выдаёт владелец сайта</div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <b>Мой сайт</b>
    <span id="whoami" class="small"></span>
    <span id="pointsTop" class="points"></span>
    <button id="btnNotif" class="gray">🔔 Вкл. уведомления</button>
    <button id="btnLogout" class="gray">Выйти</button>
  </div>

  <!-- ЛЕНТА: все пункты одной колонкой -->
  <div class="wrap">

    <div class="panel">
      <h3>👤 Кабинет</h3>
      <div class="small">Мои баллы</div>
      <div class="points" id="pointsBig">0</div>
      <hr class="divider">
      <div class="small" style="margin-bottom:6px">Мои записи</div>
      <div class="row">
        <input id="recText" placeholder="Текст записи">
        <button id="btnAddRec">Добавить</button>
      </div>
      <div id="recList"></div>
    </div>

    <div class="panel">
      <h3>🔔 Уведомления <span id="notifBadge"></span></h3>
      <div id="notifList"></div>
    </div>

    <div id="adminSection" class="hidden">
      <div class="panel">
        <h3>👥 Аккаунты</h3>
        <div class="row">
          <input id="newNick" placeholder="Ник нового участника">
          <input id="newPass" placeholder="Пароль (мин. 6 символов)">
          <button id="btnCreate">Создать</button>
        </div>
        <div id="createMsg" class="ok"></div>
        <hr class="divider">
        <div class="small" style="margin-bottom:6px">Все участники</div>
        <button id="btnReload" class="gray" style="margin-top:0">Обновить список</button>
        <div id="accList"></div>
      </div>

      <div class="panel">
        <h3>⭐ Баллы</h3>
        <div class="row">
          <select id="ptsUser"></select>
          <input id="ptsAmount" type="number" min="1" value="10" style="max-width:110px">
          <button id="btnAddPts">＋ Начислить</button>
          <button id="btnSubPts" class="danger">－ Списать</button>
        </div>
        <div id="ptsMsg" class="ok"></div>
      </div>

      <div class="panel">
        <h3>📣 Разослать</h3>
        <label>Кому</label>
        <select id="sendTo"><option value="all">Всем</option></select>
        <label>Текст</label>
        <textarea id="sendText" rows="2" placeholder="Сообщение для участников"></textarea>
        <button id="btnSend">Отправить</button>
        <div id="sendMsg" class="ok"></div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {

/* ═══════════════════════════════════════════════════════
   ⚠️ ЕДИНСТВЕННОЕ МЕСТО ДЛЯ ПРАВКИ.
   В строку ниже вставь адрес, скопированный кнопкой Copy
   из панели Supabase (рядом с https://hpc...supabase.co)
   ═══════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://hpcjtximxeuqtlidkacv.supabase.co";
const SUPABASE_KEY = "sb_publishable_PHPrQs4SWGAbALyGONePyA_paI6vt4A";

const ADMIN_EMAIL = 'polostyanoy@mysait.local';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, myNick = '', isAdmin = false, savedCreds = null;
let pollTimer = null, pollLast = new Date().toISOString();
let notifCache = [], seen = new Set(), accounts = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('btnLogin').onclick = login;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const nick = $('nick').value.trim().toLowerCase();
  const pass = $('pass').value;
  $('authMsg').textContent = '';
  if (!nick || !pass) { $('authMsg').textContent = 'Заполни ник и пароль'; return; }
  const email = nick + '@mysait.local';
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    $('authMsg').textContent = /invalid/i.test(error.message) ? 'Неверный ник или пароль' : (error.message || 'Не удалось войти');
    return;
  }
  savedCreds = { email, pass };
  sessionStorage.setItem('admin_creds', JSON.stringify(savedCreds));
  enterApp(nick);
}

async function enterApp(nick) {
  const { data: u } = await supabase.auth.getUser();
  me = u.user;
  myNick = nick;
  isAdmin = (me.email === ADMIN_EMAIL);

  const { data: rows } = await supabase.from('accounts').select('*').eq('user_id', me.id);
  if (!rows || !rows.length) {
    await supabase.from('accounts').insert({ user_id: me.id, nick, points: 0 });
  }

  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoami').textContent = myNick + (isAdmin ? ' (владелец)' : '');
  if (isAdmin) $('adminSection').classList.remove('hidden');

  await loadAccounts();
  await initNotifications();
  await loadRecords();
  await refreshPoints();
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 10000);
  window.scrollTo(0, 0);
}

async function refreshPoints() {
  const { data } = await supabase.from('accounts').select('points').eq('user_id', me.id).maybeSingle();
  const p = data ? (data.points || 0) : 0;
  $('pointsTop').textContent = '⭐ ' + p;
  $('pointsBig').textContent = p;
}

async function loadRecords() {
  const { data } = await supabase.from('records').select('*').eq('user_id', me.id).order('created_at', { ascending: false });
  const list = $('recList'); list.innerHTML = '';
  for (const r of (data || [])) {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span>${esc(r.text)}</span>`;
    const b = document.createElement('button');
    b.className = 'danger'; b.style.cssText = 'margin-top:0;padding:4px 10px'; b.textContent = '✕';
    b.onclick = async () => { await supabase.from('records').delete().eq('id', r.id); loadRecords(); };
    d.appendChild(b);
    list.appendChild(d);
  }
  if (!(data || []).length) list.innerHTML = '<div class="small">Пока пусто</div>';
}
$('btnAddRec').onclick = async () => {
  const t = $('recText').value.trim();
  if (!t) return;
  await supabase.from('records').insert({ user_id: me.id, text: t });
  $('recText').value = '';
  loadRecords();
};

async function loadAccounts() {
  if (!isAdmin) return;
  const { data } = await supabase.from('accounts').select('*').order('nick');
  accounts = data || [];
  const list = $('accList'); list.innerHTML = '';
  for (const a of accounts) {
    const d = document.createElement('div'); d.className = 'item';
    const me_ = a.user_id === me.id;
    d.innerHTML = `<span>${esc(a.nick)}${me_ ? ' <span class="small">(вы)</span>' : ''}<br><span class="small">⭐ ${a.points || 0} балл.</span></span>`;
    const del = document.createElement('button');
    del.className = 'danger'; del.style.cssText = 'margin-top:0;padding:6px 12px;font-size:13px';
    del.textContent = '🗑 Удалить';
    del.disabled = me_;
    if (me_) del.title = 'Нельзя удалить себя';
    del.onclick = () => deleteMember(a);
    d.appendChild(del);
    list.appendChild(d);
  }
  if (!accounts.length) list.innerHTML = '<div class="small">Пока никого</div>';
  fillAdminSelects();
}
$('btnReload').onclick = loadAccounts;

async function deleteMember(a) {
  if (!confirm('Удалить участника «' + a.nick + '»? Его баллы и запись о нём исчезнут.')) return;
  const { error } = await supabase.from('accounts').delete().eq('id', a.id);
  if (error) { toast('Не удалось удалить: ' + error.message); return; }
  toast('Участник ' + a.nick + ' удалён');
  await loadAccounts();
  await refreshPoints();
}

function fillAdminSelects() {
  const pu = $('ptsUser'), cur = pu.value;
  pu.innerHTML = accounts.map(a => `<option value="${a.id}">${esc(a.nick)} — ${a.points || 0} балл.</option>`).join('');
  if (cur && accounts.some(a => a.id === cur)) pu.value = cur;
  const st = $('sendTo'), cur2 = st.value;
  st.innerHTML = '<option value="all">Всем</option>' +
    accounts.filter(a => a.user_id && a.user_id !== me.id)
            .map(a => `<option value="${a.user_id}">${esc(a.nick)}</option>`).join('');
  if (cur2) st.value = cur2;
}

$('btnCreate').onclick = async () => {
  const nick = $('newNick').value.trim().toLowerCase();
  const pass = $('newPass').value;
  const msg = $('createMsg'); msg.className = 'ok'; msg.textContent = '';
  if (!nick || !pass) { msg.className = 'err'; msg.textContent = 'Заполни ник и пароль'; return; }
  if (pass.length < 6) { msg.className = 'err'; msg.textContent = 'Пароль минимум 6 символов'; return; }
  if (accounts.some(a => a.nick === nick)) { msg.className = 'err'; msg.textContent = 'Такой ник уже есть'; return; }
  if (!savedCreds) { try { savedCreds = JSON.parse(sessionStorage.getItem('admin_creds')); } catch (e) {} }
  const { data, error } = await supabase.auth.signUp({ email: nick + '@mysait.local', password: pass });
  if (error) { msg.className = 'err'; msg.textContent = error.message; return; }
  await supabase.from('accounts').insert({ user_id: data.user.id, nick, points: 0 });
  if (savedCreds) {
    await supabase.auth.signOut();
    await supabase.auth.signInWithPassword(savedCreds);
  }
  msg.textContent = 'Аккаунт ' + nick + ' создан';
  $('newNick').value = ''; $('newPass').value = '';
  await loadAccounts();
};

async function changePoints(sign, word) {
  const id = $('ptsUser').value;
  const amt = parseInt($('ptsAmount').value, 10);
  const msg = $('ptsMsg'); msg.className = 'ok'; msg.textContent = '';
  if (!id || !amt || amt <= 0) { msg.className = 'err'; msg.textContent = 'Выбери участника и укажи число'; return; }
  const a = accounts.find(x => x.id === id);
  if (!a) { msg.className = 'err'; msg.textContent = 'Нажми «Обновить список»'; return; }
  const newVal = Math.max(0, (a.points || 0) + sign * amt);
  const { error } = await supabase.from('accounts').update({ points: newVal }).eq('id', id);
  if (error) { msg.className = 'err'; msg.textContent = 'Не получилось: ' + error.message; return; }
  await supabase.from('notifications').insert({
    recipient_id: a.user_id,
    text: `Вам ${word} ${amt} балл(ов). Теперь у вас ${newVal}.`
  });
  msg.textContent = (sign > 0 ? '+' : '−') + amt + ' → у ' + a.nick + ' теперь ' + newVal + ' баллов';
  await loadAccounts();
  await refreshPoints();
}
$('btnAddPts').onclick = () => changePoints(1, 'начислено');
$('btnSubPts').onclick = () => changePoints(-1, 'списано');

$('btnSend').onclick = async () => {
  const to = $('sendTo').value;
  const text = $('sendText').value.trim();
  const msg = $('sendMsg'); msg.className = 'ok'; msg.textContent = '';
  if (!text) { msg.className = 'err'; msg.textContent = 'Введи текст'; return; }
  const { error } = await supabase.from('notifications').insert({
    recipient_id: to === 'all' ? null : to,
    text
  });
  if (error) { msg.className = 'err'; msg.textContent = 'Ошибка: ' + error.message; return; }
  msg.textContent = 'Отправлено!';
  $('sendText').value = '';
};

function seenKey() { return 'seen_' + (me ? me.email : ''); }
function loadSeen() { try { seen = new Set(JSON.parse(localStorage.getItem(seenKey()) || '[]')); } catch (e) { seen = new Set(); } }
function saveSeen() { localStorage.setItem(seenKey(), JSON.stringify([...seen])); }

async function initNotifications() {
  loadSeen();
  const { data } = await supabase.from('notifications').select('*').order('created_at', { ascending: false }).limit(100);
  notifCache = (data || []).filter(n => !n.recipient_id || n.recipient_id === me.id);
  notifCache.forEach(n => seen.add(n.id));
  saveSeen();
  renderNotifs();
  pollLast = new Date().toISOString();
}

async function poll() {
  if (!me) return;
  const { data } = await supabase.from('notifications').select('*').gt('created_at', pollLast).order('created_at');
  pollLast = new Date().toISOString();
  const fresh = (data || []).filter(n => (!n.recipient_id || n.recipient_id === me.id) && !seen.has(n.id));
  if (fresh.length) {
    notifCache = [...fresh, ...notifCache].slice(0, 100);
    seen.clear(); notifCache.forEach(n => seen.add(n.id)); saveSeen();
    renderNotifs();
    fresh.forEach(n => toast('🔔 ' + n.text));
    beep();
  }
}

function renderNotifs() {
  const l = $('notifList');
  l.innerHTML = notifCache.length ? '' : '<div class="small">Пока пусто</div>';
  for (const n of notifCache) {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span>${esc(n.text)}</span><span class="small" style="white-space:nowrap">${new Date(n.created_at).toLocaleString('ru', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</span>`;
    l.appendChild(d);
  }
  updateBadge();
}

function updateBadge() {
  $('notifBadge').innerHTML = '';
}

let toastTimer = null;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 5000);
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.18);
    setTimeout(() => ctx.close(), 500);
  } catch (e) {}
}
$('btnNotif').onclick = async () => {
  if (!('Notification' in window)) { toast('Браузер не поддерживает уведомления'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    $('btnNotif').textContent = '🔔 Уведомления вкл.';
    new Notification('Мой сайт', { body: 'Уведомления включены!' });
  }
};

$('btnLogout').onclick = async () => {
  clearInterval(pollTimer);
  await supabase.auth.signOut();
  location.reload();
};

(async () => {
  const { data } = await supabase.auth.getSession();
  const s = data.session;
  if (s && s.user) {
    try { savedCreds = JSON.parse(sessionStorage.getItem('admin_creds')); } catch (e) {}
    enterApp(s.user.email.split('@')[0]);
  }
})();

})();
</script>
</body>
</html>
